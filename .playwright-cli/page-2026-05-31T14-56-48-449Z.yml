  - main [ref=e22]:
    - generic [ref=e24]:
      - paragraph [ref=e25]: About the Event
      - heading "Our Story" [level=1] [ref=e26]
      - paragraph [ref=e27]: Born from Uganda's coffee fields. Built to celebrate the women who make it possible — and to plant roots that last.
    - generic [ref=e30]:
      - generic [ref=e31]:
        - paragraph [ref=e32]: Why We Run
        - heading "Why We Started" [level=2] [ref=e33]
        - paragraph [ref=e34]: We started running because we saw untapped potential in coffee-growing communities — especially among women — whose labour sustains the industry but whose voices and opportunities are often overlooked. Coffee farming in Uganda is more than an economic activity; it is a way of life passed down through generations.
        - paragraph [ref=e35]: Yet many women remain locked out of decision-making, fair markets, and financial security. The Coffee Marathon was born as a bold response to uplift these communities, using visibility and collective action to create opportunity where it is most needed.
        - paragraph [ref=e36]: At the same time, we wanted to spotlight Ugandan coffee on the global stage — not just as a high-quality product, but as a story of people, culture, and resilience.
      - img "Athletes lined up at the start of The Coffee Marathon" [ref=e38]
    - generic [ref=e41]:
      - img "Female runner finishing — Coffee Marathon 2025" [ref=e43]
      - generic [ref=e44]:
        - paragraph [ref=e45]: The Movement
        - heading "Why We Continue" [level=2] [ref=e46]
        - paragraph [ref=e47]: Today, we continue to run because awareness alone is no longer enough. While visibility opened doors, real change requires deeper, sustained engagement. The Coffee Marathon has evolved from a moment of recognition into a movement for action — one that goes beyond telling stories to actively changing lives.
        - paragraph [ref=e48]: Our focus now is on moving from visibility to sustainable empowerment. This means supporting initiatives that strengthen women's participation in coffee value chains, improve livelihoods, and build local capacity.
        - paragraph [ref=e49]: Each race is a renewed commitment to measurable impact — connecting runners, partners, and communities in ways that create lasting economic and social value long after the finish line.
    - generic [ref=e51]:
      - generic [ref=e52]:
        - paragraph [ref=e53]: 2026 Theme
        - heading "Empowering the IK Community of Karamoja" [level=2] [ref=e54]
        - paragraph [ref=e56]: “Empowering the IK Community of Karamoja through Coffee Farming to End Poverty”
      - generic [ref=e57]:
        - generic [ref=e58]:
          - heading "Who Are the Ik, and Why They Matter" [level=3] [ref=e59]
          - paragraph [ref=e60]: The Ik are one of Uganda's most marginalised and least understood indigenous communities, living in the remote mountainous region of Karamoja. For generations, they have faced extreme isolation, food insecurity, and limited access to land, education, and economic opportunity.
          - paragraph [ref=e61]: They matter because they represent both a moral responsibility and an opportunity for transformation. Empowering the Ik is not about charity — it is about restoring dignity, agency, and inclusion.
          - heading "Why Coffee Farming Is the Path Out of Poverty" [level=3] [ref=e62]
          - paragraph [ref=e63]: Coffee farming offers a long-term, climate-resilient livelihood that can thrive in suitable highland conditions while generating consistent income over time. For the Ik community, coffee farming represents more than income — it creates opportunities for skills development, cooperative structures, and integration into national and global value chains.
        - generic [ref=e64]:
          - generic [ref=e68]:
            - heading "Introduce & Scale Sustainable Coffee Farming" [level=4] [ref=e69]
            - paragraph [ref=e70]: Identifying suitable land, promoting climate-smart practices, and building community-led systems that ensure coffee farming thrives across seasons and generations.
          - generic [ref=e74]:
            - heading "Equip Households with Skills, Seedlings & Market Access" [level=4] [ref=e75]
            - paragraph [ref=e76]: Households receive high-quality coffee seedlings, hands-on training in sustainable farming, and links to reliable markets and cooperative structures.
          - generic [ref=e80]:
            - heading "Create Long-Term Income and Food Security" [level=4] [ref=e81]
            - paragraph [ref=e82]: Coffee farming provides predictable income that allows households to plan — covering education, healthcare, and daily needs — while diversifying crops for food security.
          - generic [ref=e86]:
            - heading "Reduce Dependence and End Cycles of Poverty" [level=4] [ref=e87]
            - paragraph [ref=e88]: By investing in productive assets rather than short-term aid, communities gain control over their own livelihoods. The goal is self-reliance and dignified economic participation.
      - generic [ref=e90]:
        - img "Inspire Africa Group — IK Community outreach" [ref=e91]
        - paragraph [ref=e94]: Dr. Nelson Tugume, CEO of Inspire Africa Group, during one of the humanitarian outreaches in the IK community.
    - generic [ref=e97]:
      - generic [ref=e98]:
        - paragraph [ref=e99]: Coffee with a Cause
        - heading "More than a crop. A story." [level=2] [ref=e100]
        - paragraph [ref=e101]: The true value of coffee goes far beyond its taste or price — it lies in its story. When coffee is deeply linked to its origin, its people, and a clear purpose, it becomes more than a commodity; it becomes a product with meaning.
        - paragraph [ref=e102]: Ultimately, when people understand the journey of coffee — from soil to cup, from farmer to consumer — they value it more. And when coffee is valued more, farmers earn more, communities grow stronger, and Uganda's coffee earns its rightful place as a premium, ethical product on the global stage.
        - link "Run with a cause" [ref=e103] [cursor=pointer]:
          - /url: "#pinnket-register-10k"
          - text: Run with a cause
